<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lotusGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9A84C" />
      <stop offset="50%" stop-color="#EEDC9A" />
      <stop offset="100%" stop-color="#8A6E2F" />
    </linearGradient>
    <radialGradient id="ringGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0.6" />
    </radialGradient>
  </defs>

  <!-- Orbits -->
  <circle cx="200" cy="200" r="160" stroke="url(#ringGradient)" stroke-width="1" stroke-dasharray="10 20">
    <animateTransform attributeName="transform" type="rotate" from="0 200 200" to="360 200 200" dur="10s" repeatCount="indefinite" />
  </circle>
  <circle cx="200" cy="200" r="180" stroke="url(#ringGradient)" stroke-width="0.5" stroke-dasharray="2 10">
    <animateTransform attributeName="transform" type="rotate" from="360 200 200" to="0 200 200" dur="15s" repeatCount="indefinite" />
  </circle>

  <!-- Lotus Flower Core -->
  <g id="lotus-core">
    <!-- Center Point -->
    <circle cx="200" cy="200" r="5" fill="#EEDC9A" />
    
    <!-- Outer Petals (8) -->
    <path fill="url(#lotusGradient)" d="M200 120 C220 160 220 180 200 200 C180 180 180 160 200 120" />
    <path fill="url(#lotusGradient)" d="M200 280 C180 240 180 220 200 200 C220 220 220 240 200 280" />
    <path fill="url(#lotusGradient)" d="M120 200 C160 220 180 220 200 200 C180 180 160 180 120 200" />
    <path fill="url(#lotusGradient)" d="M280 200 C240 180 220 180 200 200 C220 220 240 220 280 200" />
    
    <path fill="url(#lotusGradient)" d="M143.4 143.4 C171.7 171.7 185.8 185.8 200 200 C171.7 171.7 157.6 157.6 143.4 143.4" transform="rotate(45, 200, 200)" />
    <path fill="url(#lotusGradient)" d="M256.6 143.4 C228.3 171.7 214.2 185.8 200 200 C228.3 171.7 242.4 157.6 256.6 143.4" transform="rotate(45, 200, 200)" />
    <path fill="url(#lotusGradient)" d="M143.4 256.6 C171.7 228.3 185.8 214.2 200 200 C171.7 228.3 157.6 242.4 143.4 256.6" transform="rotate(45, 200, 200)" />
    <path fill="url(#lotusGradient)" d="M256.6 256.6 C228.3 228.3 214.2 214.2 200 200 C228.3 228.3 242.4 242.4 256.6 256.6" transform="rotate(45, 200, 200)" />
    
    <!-- Inner Glow -->
    <circle cx="200" cy="200" r="15" fill="#C9A84C" fill-opacity="0.2" />

    <animateTransform 
      attributeName="transform" 
      type="scale" 
      values="1;1.1;1" 
      dur="4s" 
      repeatCount="indefinite" 
      additive="replace" 
      calcMode="spline" 
      keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" 
      transform-origin="200 200"
    />
    <animate 
      attributeName="opacity" 
      values="0.7;1;0.7" 
      dur="4s" 
      repeatCount="indefinite" 
    />
  </g>
</svg>
